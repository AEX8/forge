services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - INFERENCE_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
      - postgres
    volumes:
      - ./app:/app/app

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=forge
      - POSTGRES_PASSWORD=forge
      - POSTGRES_DB=forge
      - DATABASE_URL=postgresql://forge:forge@postgres:5432/forge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  ollama_data:
  postgres_data: